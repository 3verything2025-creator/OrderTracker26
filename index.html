<style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--mut);font:500 14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3,h4{margin:0;color:var(--ink);line-height:1.25}button{font:inherit;touch-action:manipulation}input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}.hide{display:none!important}.mut{color:var(--mut)}.small{font-size:12.5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border-bottom:1px solid var(--xp-line);display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap;transition:transform .45s cubic-bezier(.22,1,.36,1),padding .35s ease,box-shadow .35s ease,background .35s ease}

.top .brand-sub{font-size:12px;color:var(--xp-grey);letter-spacing:.14em;text-transform:uppercase;font-weight:700;transition:opacity .3s ease,max-height .35s ease;max-height:20px;overflow:hidden}
.top.condensed .brand-sub{opacity:0;max-height:0}
.top .xbtn-extra{transition:opacity .3s ease,transform .3s ease}
.top.condensed .xbtn-extra{opacity:0;transform:scale(.92);pointer-events:none;position:absolute;visibility:hidden}
.top h1{font-size:19px;letter-spacing:-.03em;font-weight:800;color:var(--xp-black)} .top h1 .vtag{font-size:10px;font-weight:800;background:var(--xp-black);color:#fff;border-radius:99px;padding:2px 8px;vertical-align:middle;letter-spacing:.08em}
.tabs{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.tab:hover{background:#ececee}.tab.on{background:var(--xp-black);color:#fff}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.btn:hover{border-color:var(--acc);color:var(--acc)}.btn.pri{background:var(--xp-black);border-color:var(--xp-black);color:#fff;border-radius:999px}.btn.pri:hover{background:#2c2c2e;color:#fff}.btn.teal{background:var(--xp-accent);border-color:var(--xp-accent);color:#fff;border-radius:999px}.btn.teal:hover{background:var(--xp-accent-d);color:#fff}.btn.dark{background:var(--xp-black);border-color:var(--xp-black);color:#fff;border-radius:12px}.btn{border-radius:999px}.btn.sm{padding:5px 10px;font-size:12.5px}.btn:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1180px;margin:0 auto;padding:14px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.shield{width:52px;height:52px;border-radius:12px;background:#e3f2fd;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.pilltag{font-size:11px;font-weight:800;background:#e3f2fd;color:var(--acc);border-radius:6px;padding:2px 8px;letter-spacing:.4px;text-transform:uppercase}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(5,1fr);margin:12px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}.kpi .l{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--mut);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}.kpi .v{font-size:24px;font-weight:800;color:var(--ink)}.kpi .s{font-size:12px}.kpi .bar{height:5px;background:var(--soft);border-radius:4px;margin-top:8px;overflow:hidden}.kpi .bar b{display:block;height:100%;background:var(--teal)}
.qgrid{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--sh)}.qcard .qh{display:flex;justify-content:space-between;align-items:center;gap:6px}.qcard h3{font-size:14px}.prog{height:6px;background:#e8eef4;border-radius:5px;overflow:hidden;margin:8px 0}.prog b{display:block;height:100%;background:var(--teal)}.done{font-size:11px;font-weight:800;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:2px 8px;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters input,.filters select{width:auto;flex:1 1 140px;font-size:13px;padding:8px 10px}.sbox{position:relative;flex:2 1 200px;display:flex}.sbox input{padding-left:32px}.sbox span{position:absolute;left:10px;top:9px;opacity:.6}
.secttl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}.secttl h2{font-size:14px;flex:1;min-width:200px}
.sup{background:var(--dark);color:#dbe7f2;border-radius:12px;padding:14px;margin-bottom:0;border:1px solid var(--dark)}.sup .t{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sup b.w{color:#fff}.avatar{width:38px;height:38px;border-radius:10px;background:#12394f;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}.badge{font-size:11px;background:#0f4d3a;color:#7bf0c0;border-radius:6px;padding:2px 8px;font-weight:800}.stat{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.stat b{color:#fff;font-size:14px}.stat .g{color:#4ade80;font-weight:800}.stat .y{color:#fbbf24;font-weight:800}
.mwrap{overflow-x:auto;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:#fff}.mtbl{width:100%;border-collapse:collapse;min-width:900px;font-size:13px}.mtbl th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);text-align:left;padding:10px;border-bottom:1px solid var(--line);background:#f8fbfd}.mtbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink)}.qpill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;margin:2px}.qpill i{width:9px;height:9px;border-radius:50%;background:#0b6ea8;display:inline-block}.qpill.pend{color:var(--mut)}.qpill.live{border-color:var(--teal);background:#e6f7ef}.qb{border:1px solid #bfe3d2;background:#eefaf3;color:var(--teal);border-radius:7px;padding:3px 9px;font-size:12px;font-weight:800;cursor:pointer;margin:1px}.qb:hover{background:var(--teal);color:#fff}
.dist{display:grid;gap:10px;grid-template-columns:1fr 1fr}.drow{display:grid;grid-template-columns:170px 1fr 70px;gap:8px;align-items:center;font-size:12.5px;color:var(--ink);margin:5px 0}.drow .t{height:8px;background:#edf2f7;border-radius:5px;overflow:hidden}.drow .t b{display:block;height:100%}
/* sheet */
.livebar{background:#e6f7ef;border:1px solid #bfe3d2;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#0b5c42;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cyc{display:inline-flex;background:#eef2f7;border-radius:9px;padding:3px;gap:2px}.cyc button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--mut)}.cyc button.on{background:var(--teal);color:#fff}
.sumbar{background:var(--dark);color:#dbe7f2;border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.sumbar .pct{font-size:30px;font-weight:800;color:#4ade80}.catpills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.catpills button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}.catpills button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.item{border-bottom:1px solid var(--line);padding:12px 2px}.item .ch{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ctag{font-size:11px;font-weight:800;background:#eef2f7;border-radius:6px;padding:2px 8px;color:var(--ink)}.seg{margin-left:auto;display:inline-flex;gap:6px}.seg button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-weight:700;cursor:pointer;font-size:12.5px;color:var(--ink)}.seg button.y.on{background:var(--teal);border-color:var(--teal);color:#fff}.seg button.n.on{background:var(--bad);border-color:var(--bad);color:#fff}.seg button.a.on{background:var(--dark);border-color:var(--dark);color:#fff}
.rem{display:grid;gap:8px;grid-template-columns:1fr 1fr 180px;margin-top:8px}.rem label{font-size:11.5px;font-weight:800}.rem label span{color:var(--bad)}.oknote{background:#e6f7ef;border-radius:8px;padding:7px 10px;font-size:12.5px;color:#0b5c42;margin-top:8px}
.aplan{width:100%;border-collapse:collapse;font-size:13px}.aplan th{background:#fef3f2;color:#991b1b;text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:12px}.aplan td{padding:8px;border-bottom:1px solid var(--line);color:var(--ink)}
.signs{display:grid;gap:10px;grid-template-columns:1fr 1fr}
/* teams */
.tcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;background:#fff;box-shadow:var(--sh)}
dialog{border:1px solid var(--line);border-radius:14px;padding:20px;max-width:min(480px,94vw);width:94vw;box-shadow:0 12px 44px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(10,25,40,.5)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(8px);background:var(--dark);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw}#toast.on{opacity:1;transform:translateX(-50%)}
.foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;z-index:20;margin:0 -14px -80px}
table.plain{width:100%;border-collapse:collapse;font-size:13px}table.plain td,table.plain th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}table.plain th{font-size:11px;text-transform:uppercase;color:var(--mut)}

@media(max-width:640px){main{padding:10px 10px 80px}.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:20px}.qgrid{grid-template-columns:1fr}.rem{grid-template-columns:1fr}.signs{grid-template-columns:1fr}.top{padding:10px 12px}.top h1{font-size:15px}.top.condensed{padding:6px 12px}.tab{padding:8px 12px;font-size:12.5px}.filters input,.filters select{flex:1 1 100%}.seg{margin-left:0}.drow{grid-template-columns:1fr 60px}.drow .t{grid-column:1/-1;grid-row:2}input,select,textarea{font-size:16px}.filters input,.filters select{font-size:16px}.sup .stat{margin-left:0;width:100%}.foot{margin:0 -10px -80px}.sumbar .pct{font-size:26px}.hero{flex-direction:column;align-items:flex-start}}
@media(max-width:380px){.kpis{grid-template-columns:1fr}.secttl h2{min-width:0}}

#printRoot th,#printRoot td{border:1px solid #b9c4cf;padding:4px 6px;vertical-align:top;overflow-wrap:anywhere;word-break:break-word;text-align:left}
#printRoot th{background:#e8eff5}#printRoot td.c,#printRoot th.c{text-align:center}
#printRoot thead{display:table-header-group}
#printRoot tr,#printRoot .rbox,#printRoot .rsig{break-inside:avoid;page-break-inside:avoid}
#printRoot .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
#printRoot .rgrid div{border-bottom:1px solid #d7e3ee;padding:3px 0}#printRoot .rgrid b{display:inline-block;min-width:120px;color:#333}
#printRoot .rscore{display:flex;gap:14px;align-items:center;border:2px solid #0f2a3d;border-radius:8px;padding:8px 12px;margin:10px 0}
#printRoot .rscore .p{font-size:26px;font-weight:800}
#printRoot .ar{color:#666;font-size:10.5px;margin-top:2px}
#printRoot .r-y{color:#0a7d5c;font-weight:700}#printRoot .r-n{color:#c0392b;font-weight:700}
#printRoot .ph img{height:54px;width:auto;max-width:96px;object-fit:cover;margin:3px 3px 0 0;border:1px solid #bbb;border-radius:3px}
#printRoot .rsigs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
#printRoot .rsig{border:1px solid #b9c4cf;border-radius:6px;padding:8px;min-height:120px}
#printRoot .rsig img{display:block;max-width:100%;height:70px;object-fit:contain;border-bottom:1px solid #333;margin:6px 0}
#printRoot .rfoot{margin-top:12px;color:#777;font-size:10px}

 @page{size:A4;margin:12mm}

}

function seedOrg(){
 S.managers=S.managers||[];
 if(S.orgV===1)return;
 const same=(a,b)=>String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();
 const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
 const demo=S.supervisors.length===1&&S.supervisors[0].id==="s1"&&S.techs.length===1&&S.techs[0].id==="t1"&&S.audits.every(a=>a.id==="a1"||a.id==="a2");
 if(demo){S.supervisors=[];S.techs=[];S.audits=[];S.curTech=null;}
 ORG.forEach(m=>{
  let mg=S.managers.find(x=>x.id===m.id||same(x.name,m.n));
  if(!mg){mg={id:m.id,name:m.n,role:m.role,email:""};S.managers.push(mg)}
  m.s.forEach(sp=>{
   let sv=S.supervisors.find(x=>x.id===sp.id||same(x.name,sp.n));
   const dept=sp.r==="IPM"?"IPM":"Region "+sp.r+" \u2013 "+sp.a;
   if(!sv){sv={id:sp.id,name:sp.n,email:"",dept:dept,mgr:mg.id,mgrName:mg.name,mgrEmail:mg.email||""};S.supervisors.push(sv)}
   else{sv.mgr=mg.id;sv.mgrName=mg.name;sv.mgrEmail=mg.email||"";if(!sv.dept||/Pest Control \/ Specialty/.test(sv.dept))sv.dept=dept}
   sp.t.forEach(t=>{
    let tc=S.techs.find(x=>x.id==="t-"+slug(t[0])||same(x.name,t[0]));
    if(!tc){S.techs.push({id:"t-"+slug(t[0]),name:t[0],emp:t[1],branch:sp.a,role:t[2]==="SB"?"Speciality Business Technician":(m.role==="IPM Head"?"IPM Technician":"Pest Control Technician"),sup:sv.id})}
    else{tc.sup=sv.id;if(!tc.emp&&t[1])tc.emp=t[1];if(!tc.branch)tc.branch=sp.a}
   });
  });
 });
 S.orgV=1;save();
}

function sanitizeState(){
 try{
  const arr=k=>{if(!Array.isArray(S[k]))S[k]=[]};["supervisors","techs","audits","managers"].forEach(arr);
  S.supervisors=S.supervisors.filter(x=>x&&x.id);S.techs=S.techs.filter(x=>x&&x.id);
  const sids=new Set(S.supervisors.map(x=>x.id));
  S.techs.forEach(x=>{x.name=x.name||"";if(!sids.has(x.sup))x.sup=S.supervisors[0]?S.supervisors[0].id:""});
  const tids=new Set(S.techs.map(x=>x.id));
  S.audits=S.audits.filter(a=>a&&a.id&&tids.has(a.tech)&&DIVS[a.div]);
  S.audits.forEach(a=>{["answers","ev","act","dueD"].forEach(k=>{if(!a[k]||typeof a[k]!=="object")a[k]={}});if(!a.q)a.q="Q1";const t=S.techs.find(x=>x.id===a.tech);if(t&&!S.supervisors.some(x=>x.id===a.sup))a.sup=t.sup});
  if(!DIVS[S.div])S.div="pest";
  if(!["Q1","Q2","Q3","Q4"].includes(S.quarter))S.quarter="Q2";
  if(!["dash","sheet","teams"].includes(S.view))S.view="dash";
  if(S.curTech&&!tids.has(S.curTech))S.curTech=S.techs[0]?S.techs[0].id:null;
  if(typeof S.cat!=="string")S.cat="ALL";if(typeof S.qsearch!=="string")S.qsearch="";if(typeof S.search!=="string")S.search="";
  if(S.fSup&&!sids.has(S.fSup))S.fSup="";if(S.fTech&&!tids.has(S.fTech))S.fTech="";
  if(S.fMgr&&S.fMgr!=="__none"&&!S.managers.some(m=>m.id===S.fMgr))S.fMgr="";
 }catch(e){console.error("sanitizeState",e)}
}

let __fbReady=null;
function fbEnsure(){if(__fbReady)return __fbReady;__fbReady=new Promise(res=>{try{
if(!FB_OK||typeof document==="undefined")return res(null);

add("https://www.gstatic.com/firebasejs/"+FB_SDK_V+"/firebase-app-compat.js",()=>add("https://www.gstatic.com/firebasejs/"+FB_SDK_V+"/firebase-auth-compat.js",()=>add("https://www.gstatic.com/firebasejs/"+FB_SDK_V+"/firebase-firestore-compat.js",()=>res(typeof firebase!=="undefined"?firebase:null),()=>res(null)),()=>res(null)),()=>res(null));
}catch(e){res(null);}});return __fbReady;}
async function fbFs(){const fb=await fbEnsure();if(!fb)return null;try{if(!fb.apps.length)fb.initializeApp(FIREBASE_CONFIG);if(!fb.auth||!fb.auth().currentUser)return null;return fb.firestore();}catch(e){return null;}}
function snapLight(snap){try{const c={supervisors:snap.supervisors,techs:snap.techs,managers:snap.managers,div:snap.div,exportedAt:snap.exportedAt};c.audits=(snap.audits||[]).map(a=>{const o={};for(const k in a)if(k!=="ph"&&k!=="sigT"&&k!=="sigS")o[k]=a[k];return o;});return c;}catch(e){return snap;}}
async function fbPush(payload){const fs=await fbFs();if(!fs)return false;await fs.collection("tpa").doc("latest").set({key:payload.key,ts:payload.ts,snapshot:snapLight(payload.snapshot)});return true;}
async function fbLast(){try{const fs=await fbFs();if(!fs)return null;const d=await fs.collection("tpa").doc("latest").get();return d.exists?d.data():null;}catch(e){return null;}}
async function fbRestore(){toast(t("fbWait"));try{const rec=await fbLast();if(!rec||!rec.snapshot)return toast(t("noServer"));const st=rec.snapshot;if(!st.supervisors||!st.techs||!st.audits)throw 0;if(!confirm(t("restoreC")))return;const keep={};S.audits.forEach(x=>{keep[x.id]=x});S.supervisors=st.supervisors;S.techs=st.techs;if(st.managers)S.managers=st.managers;S.audits=st.audits;S.audits.forEach(x=>{const o=keep[x.id];if(o){if(o.ph)x.ph=o.ph;["sigT","sigS","sigTAt","sigSAt"].forEach(k=>{if(o[k])x[k]=o[k]})}});if(st.div)S.div=st.div;save();render();toast(t("restored"));}catch(e){toast(t("impBad"));}}

/* ===== OFFLINE-FIRST SYNC (CloudPages static hosting) =====
   Every change is ALWAYS written to this device's localStorage first, so the
   app keeps working with zero connectivity (mobile/tablet in the field).
   When a connection is available, a debounced snapshot is POSTed as JSON:
     {key, ts, snapshot:{supervisors,techs,audits,div}}
   Any endpoint that stores the latest snapshot and answers HTTP 200 works
   (Google Apps Script, Cloudflare Worker, tiny REST API). Without an
   endpoint configured, data simply stays safe in this browser. */

function initSigs(){const a=curAudit();if(!a)return;
 $$("canvas.sigpad").forEach(cv=>{const k=cv.dataset.sig,dpr=window.devicePixelRatio||1,w=cv.clientWidth||320,h=cv.clientHeight||130;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);const g=cv.getContext("2d");g.scale(dpr,dpr);g.lineWidth=2.2;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#0f2a3d";
  if(a[k]){const im=new Image();im.onload=()=>g.drawImage(im,0,0,w,h);im.src=a[k]}
  let down=false;const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{if(cv.closest(".dis"))return;down=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}const[x,y]=pt(e);g.beginPath();g.moveTo(x,y);g.lineTo(x+.1,y+.1);g.stroke();g.beginPath();g.moveTo(x,y);e.preventDefault()};
  cv.onpointermove=e=>{if(!down)return;const[x,y]=pt(e);g.lineTo(x,y);g.stroke();g.beginPath();g.moveTo(x,y);e.preventDefault()};
  const end=()=>{if(!down)return;down=false;const cur=curAudit();if(!cur)return;cur[k]=cv.toDataURL("image/png");cur[k+"At"]=new Date().toISOString();save()};
  cv.onpointerup=end;cv.onpointercancel=end;cv.onpointerleave=end;});}

 const sig=(img,at,label,nm,dt)=>`<div class="rsig"><b>${label}</b>${img?`<img src="${img}" alt="">`:`<div style="height:70px;border-bottom:1px solid #333;margin:6px 0;color:#999;padding-top:48px">${t("rNotSigned")}</div>`}<div>${esc(nm||"")}</div><div class="ar">${esc(dt||(at?new Date(at).toLocaleDateString():""))}</div></div>`;
 return `<div class="r"><h1>Hardy Henry Services</h1><div class="rsub">${t("rTitle")}</div>
<div class="rgrid rbox"><div><b>${t("rTech")}</b>${esc(tech.name||"")}</div><div><b>${t("rEmp")}</b>${esc(tech.emp||"")}</div><div><b>${t("rBranch")}</b>${esc(tech.branch||"")}</div><div><b>${t("rRole")}</b>${esc(tech.role||"")}</div><div><b>${t("rSup")}</b>${esc(sp.name||"")}</div><div><b>${t("rDiv")}</b>${esc(a.div==="pest"?t("divPest"):t("divInit"))}</div><div><b>${t("rQ")}</b>${a.q}${qd?" ("+esc(qm(qd))+")":""}</div><div><b>${t("rDate")}</b>${esc(a.date||"")}</div><div><b>${t("rNext")}</b>${esc(a.due||"")}</div><div><b>${t("rStatus")}</b>${a.locked===false?t("rDraft"):t("rLocked")}</div></div>

<h3>${t("rCat")}</h3><table><colgroup><col style="width:55%"><col style="width:15%"><col style="width:15%"><col style="width:15%"></colgroup><thead><tr><th>${t("rCritC")}</th><th class="c">${t("rYes")}</th><th class="c">${t("rApp")}</th><th class="c">${t("rPct")}</th></tr></thead><tbody>${catRows}</tbody></table>

<h3>${t("rCom")}</h3><div class="rgrid"><div class="rbox"><b>${t("rTC")}</b><br>${esc(a.tCom||"\u2014")}</div><div class="rbox"><b>${t("rSC")}</b><br>${esc(a.sCom||"\u2014")}</div></div>
<h3>${t("rSign")}</h3><div class="rsigs">${sig(a.sigT,a.sigTAt,t("sigTech"),tech.name,a.tDate)}${sig(a.sigS,a.sigSAt,t("sigSup"),sp.name,a.sDate)}</div>
<div class="rfoot">${t("rGen")} ${esc(new Date().toLocaleString())}</div></div>`}

 const status=d==null?`<span class="bkwarn">${t("bkNever")}</span>`:old?`<span class="bkwarn">${t("bkOld").replace("{d}",d)}</span>`:`<span class="bkok">${t("bkFresh").replace("{d}",d)}</span>`;
 let restore="";
 if(!bkCanRestore())restore=`<div class="bkbox"><h4>${t("bkRs")}</h4><p class="small">${t("bkOnlyAdmin")}</p></div>`;
 else if(BK_PENDING){const pc=bkCounts(BK_PENDING.st);
  restore=`<div class="bkbox"><h4>${t("bkRs")}</h4><p class="small">${esc(BK_PENDING.name)}${BK_PENDING.at?" \u00b7 "+t("bkFileFrom")+" "+esc(new Date(BK_PENDING.at).toLocaleString()):""}</p>
  <div class="bkstat"><span><b>${pc.s}</b> ${t("bkSupN")}</span><span><b>${pc.t}</b> ${t("bkTechN")}</span><span><b>${pc.a}</b> ${t("bkAudN")}</span><span><b>${pc.p}</b> ${t("bkPhN")}</span><span><b>${pc.g}</b> ${t("bkSigN")}</span></div>
  <div class="row"><button class="btn danger" id="bkReplace">${t("bkReplace")}</button><button class="btn" id="bkMerge">${t("bkMerge")}</button><button class="btn" id="bkCancel">${t("bkCancel")}</button></div></div>`;}
 else restore=`<div class="bkbox"><h4>${t("bkRs")}</h4><p class="small">${t("bkRsD")}</p><div class="row"><button class="btn" id="bkPick">${t("bkPick")}</button><input type="file" id="bkFile" accept="application/json,.json" class="hide">${localStorage.getItem("tpa_v4_prerestore")?`<button class="btn" id="bkUndo">${t("bkUndo")}</button>`:""}</div></div>`;
 const cloud=(FB_OK&&typeof AUTH_USER!=="undefined"&&AUTH_USER&&isAdmin())?`<div class="bkbox"><h4>\u2601 ${t("bkCloud")}</h4><p class="small">${t("bkCloudD")}</p><button class="btn" id="bkSnap">${t("bkSnap")}</button><div class="bklist" id="bkCloudList"></div></div>`:"";
 openModal(`<h3>\ud83d\udcbe ${t("bkT")}</h3>
 <div class="bkbox"><h4>${t("bkLast")}</h4><div>${status}</div>${stat}<p class="small">${t("bkDlD")}</p><button class="btn teal" id="bkDl">\u2b07 ${t("bkDl")}</button></div>
 ${restore}${cloud}
 <div class="row" style="margin-top:12px"><span class="grow"></span><button class="btn" value="cancel">${t("closeB")}</button></div>`);
 $("#bkDl").onclick=e=>{e.preventDefault();bkDownload();showBackup();};
 const pk=$("#bkPick"),fi=$("#bkFile");
 if(pk)pk.onclick=e=>{e.preventDefault();fi.click();};
 if(fi)fi.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const st=j.store||j;if(!Array.isArray(st.supervisors)||!Array.isArray(st.techs)||!Array.isArray(st.audits))throw 0;BK_PENDING={name:f.name,at:j.at||"",st};}catch(x){BK_PENDING=null;toast(t("bkBad"));}showBackup();};r.readAsText(f);};
 const bc=$("#bkCancel");if(bc)bc.onclick=e=>{e.preventDefault();BK_PENDING=null;showBackup();};
 const br=$("#bkReplace");if(br)br.onclick=e=>{e.preventDefault();if(!confirm(t("bkReplaceC")))return;bkSafety();applySnapshot(BK_PENDING.st,"replace");BK_PENDING=null;$("#modal").close();toast(t("bkDone"));};
 const bm=$("#bkMerge");if(bm)bm.onclick=e=>{e.preventDefault();bkSafety();applySnapshot(BK_PENDING.st,"merge");BK_PENDING=null;$("#modal").close();toast(t("bkMerged"));};
 const bu=$("#bkUndo");if(bu)bu.onclick=e=>{e.preventDefault();try{const o=JSON.parse(localStorage.getItem("tpa_v4_prerestore"));applySnapshot(o.store,"replace");localStorage.removeItem("tpa_v4_prerestore");$("#modal").close();toast(t("bkUndone"));}catch(x){toast(t("bkNoUndo"));}};
 const sn=$("#bkSnap");if(sn){sn.onclick=async e=>{e.preventDefault();sn.disabled=true;try{await cloudSnapSave();toast(t("bkSnapOk"));}catch(x){toast(t("bkSnapFail"));}sn.disabled=false;cloudSnapList();};cloudSnapList();}
}
async function cloudSnapSave(){const fs=await fbFs();if(!fs)throw 0;const id=new Date().toISOString().replace(/[:.]/g,"-");
 await fs.collection("backups").doc(id).set({ts:Date.now(),by:AUTH_USER?AUTH_USER.email:"",counts:bkCounts(bkStore()),snapshot:snapLight(snapshot())});}
async function cloudSnapList(){const box=$("#bkCloudList");if(!box)return;
 try{const fs=await fbFs();const q=await fs.collection("backups").orderBy("ts","desc").limit(10).get();const rows=[];q.forEach(d=>rows.push({id:d.id,...d.data()}));
  box.innerHTML=rows.length?rows.map(r=>`<div class="row"><span class="small">${esc(new Date(r.ts).toLocaleString())} \u00b7 ${esc(r.by||"")} \u00b7 ${r.counts?r.counts.t+" "+t("bkTechN")+", "+r.counts.a+" "+t("bkAudN"):""}</span><span class="grow"></span><button class="btn sm" data-snap="${esc(r.id)}">${t("bkRest")}</button></div>`).join(""):`<span class="small">${t("bkNoSnap")}</span>`;
  box.querySelectorAll("[data-snap]").forEach(b=>b.onclick=e=>{e.preventDefault();const r=rows.find(x=>x.id===b.dataset.snap);if(!r||!r.snapshot)return;if(!confirm(t("bkRestC")))return;bkSafety();applySnapshot(r.snapshot,"replace");$("#modal").close();toast(t("bkDone"));});
 }catch(x){box.innerHTML=`<span class="small">${esc(authErr?authErr(x):"")}</span>`;}}
$("#backupBtn").onclick=showBackup;
setTimeout(()=>{updateBackupDot();},0);

/* ===== LOGIN (Firebase Authentication: e-mail + password) =====
   Shown whenever Firebase is configured. Accounts are verified by e-mail; the
   two ADMIN_EMAILS get the admin controls (cloud/backup settings + user list).
   NOTE: this screen only controls the app's UI. What really protects the data
   is the Firestore rules (see the instructions that came with this file). */
const ADMIN_EMAILS=["jhow@hardyhenry.mu","it@hardyhenry.mu"];
const ALLOWED_DOMAIN="hardyhenry.mu";
const AUTH_GATE=!!FB_OK;
let AUTH_USER=null,AUTH_MODE="signin";
const AT={
en:{sub:"Hardy Henry Services \u00b7 Sign in to continue",email:"E-mail",pw:"Password",pw2:"Confirm password",
 tabIn:"Sign in",tabUp:"Create account",forgot:"Forgot password?",back:"\u2190 Back to sign in",
 resetT:"Reset your password",resetD:"Enter your e-mail and we will send you a link to choose a new password.",resetBtn:"Send reset link",
 resetOk:"If an account exists for this e-mail, a reset link is on its way. Check your inbox (and spam).",
 verT:"Verify your e-mail",verD:"We sent a verification link to {e}. Open it, then press the button below.",verBtn:"I have verified \u2013 continue",verResend:"Resend e-mail",verSent:"Verification e-mail sent.",verNo:"Not verified yet. Open the link in the e-mail first.",
 out:"Sign out",eInvalid:"Enter a valid e-mail address.",ePw:"Password must have at least 8 characters.",ePwMatch:"Passwords do not match.",eDomain:"Only @{d} e-mail addresses can create an account.",
 eCred:"Wrong e-mail or password.",eExists:"An account with this e-mail already exists. Sign in instead.",eMany:"Too many attempts. Wait a few minutes and try again.",eNet:"No connection. Check your internet and try again.",eOther:"Something went wrong ({c}).",
 loading:"Loading\u2026",noSdk:"Sign-in could not be loaded. Check your internet connection.",retry:"Try again",
 fileT:"Open this app from a web address",fileD:"Sign-in only works when the page is served over https (or http://localhost), not opened as a file from your computer.",offline:"Continue offline (no cloud)",
 users:"Users",usersT:"Registered users",usersNone:"No users yet.",colEmail:"E-mail",colRole:"Role",colSeen:"Last sign-in",admin:"Administrator",user:"User",closeW:"Close"},
fr:{sub:"Hardy Henry Services \u00b7 Connectez-vous pour continuer",email:"E-mail",pw:"Mot de passe",pw2:"Confirmer le mot de passe",
 tabIn:"Connexion",tabUp:"Cr\u00e9er un compte",forgot:"Mot de passe oubli\u00e9 ?",back:"\u2190 Retour \u00e0 la connexion",
 resetT:"R\u00e9initialiser votre mot de passe",resetD:"Saisissez votre e-mail : nous vous enverrons un lien pour choisir un nouveau mot de passe.",resetBtn:"Envoyer le lien",
 resetOk:"Si un compte existe pour cet e-mail, un lien de r\u00e9initialisation est en route. V\u00e9rifiez votre bo\u00eete de r\u00e9ception (et les spams).",
 verT:"V\u00e9rifiez votre e-mail",verD:"Nous avons envoy\u00e9 un lien de v\u00e9rification \u00e0 {e}. Ouvrez-le, puis appuyez sur le bouton ci-dessous.",verBtn:"J\u2019ai v\u00e9rifi\u00e9 \u2013 continuer",verResend:"Renvoyer l\u2019e-mail",verSent:"E-mail de v\u00e9rification envoy\u00e9.",verNo:"Pas encore v\u00e9rifi\u00e9. Ouvrez d\u2019abord le lien dans l\u2019e-mail.",
 out:"Se d\u00e9connecter",eInvalid:"Saisissez une adresse e-mail valide.",ePw:"Le mot de passe doit contenir au moins 8 caract\u00e8res.",ePwMatch:"Les mots de passe ne correspondent pas.",eDomain:"Seules les adresses @{d} peuvent cr\u00e9er un compte.",
 eCred:"E-mail ou mot de passe incorrect.",eExists:"Un compte existe d\u00e9j\u00e0 avec cet e-mail. Connectez-vous.",eMany:"Trop de tentatives. Patientez quelques minutes puis r\u00e9essayez.",eNet:"Pas de connexion. V\u00e9rifiez votre internet et r\u00e9essayez.",eOther:"Une erreur est survenue ({c}).",
 loading:"Chargement\u2026",noSdk:"La connexion n\u2019a pas pu \u00eatre charg\u00e9e. V\u00e9rifiez votre connexion internet.",retry:"R\u00e9essayer",
 fileT:"Ouvrez cette application depuis une adresse web",fileD:"La connexion ne fonctionne que si la page est servie en https (ou http://localhost), pas ouverte comme fichier depuis votre ordinateur.",offline:"Continuer hors ligne (sans cloud)",
 users:"Utilisateurs",usersT:"Utilisateurs inscrits",usersNone:"Aucun utilisateur.",colEmail:"E-mail",colRole:"R\u00f4le",colSeen:"Derni\u00e8re connexion",admin:"Administrateur",user:"Utilisateur",closeW:"Fermer"}};
const at=(k,v)=>{let x=(AT[S.lang]||AT.en)[k]||AT.en[k]||k;if(v)for(const n in v)x=x.split("{"+n+"}").join(v[n]);return x;};
const isAdmin=()=>!!(AUTH_USER&&ADMIN_EMAILS.indexOf((AUTH_USER.email||"").toLowerCase())>-1);
async function fbAuth(){const fb=await fbEnsure();if(!fb)return null;try{if(!fb.apps.length)fb.initializeApp(FIREBASE_CONFIG);return fb.auth();}catch(e){return null;}}
function authErr(e){const c=(e&&e.code)||"";
 if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return at("eCred");
 if(c==="auth/email-already-in-use")return at("eExists");
 if(c==="auth/too-many-requests")return at("eMany");
 if(c==="auth/network-request-failed")return at("eNet");
 if(c==="auth/weak-password")return at("ePw");
 if(c==="auth/invalid-email")return at("eInvalid");
 return at("eOther",{c:c||"?"});}
const validMail=m=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m);

function showAuth(mode,msg,kind){
 const keep=($("#auE")||{}).value||"";AUTH_MODE=mode;
 document.body.classList.add("locked");const a=$("#auth");a.style.display="flex";
 const head=`<div class="au-lang"><button data-al="en"${S.lang==="en"?' class="on"':""}>EN</button><button data-al="fr"${S.lang==="fr"?' class="on"':""}>FR</button></div><div class="au-logo">\ud83d\udee1\ufe0f</div><h1>TPA Assessment</h1><div class="au-sub">${esc(at("sub"))}</div>`;
 const m=`<div class="au-msg ${kind||""}" id="auM" role="alert">${esc(msg||"")}</div>`;
 let body="";
 if(mode==="signin"||mode==="signup"){const up=mode==="signup";
  body=`<div class="au-tabs"><button data-am="signin"${up?"":' class="on"'}>${at("tabIn")}</button><button data-am="signup"${up?' class="on"':""}>${at("tabUp")}</button></div>
  <form id="auF" novalidate><label>${at("email")}<input id="auE" type="email" autocomplete="username" inputmode="email" value="${esc(keep)}"></label>
  <label>${at("pw")}<input id="auP" type="password" autocomplete="${up?"new-password":"current-password"}"></label>
  ${up?`<label>${at("pw2")}<input id="auP2" type="password" autocomplete="new-password"></label>`:""}
  ${m}<button class="btn teal au-go" type="submit">${up?at("tabUp"):at("tabIn")}</button></form>
  ${up?"":`<button class="au-link" data-am="reset">${at("forgot")}</button>`}`;
 }else if(mode==="reset"){
  body=`<h2>${at("resetT")}</h2><p class="au-note">${at("resetD")}</p>
  <form id="auF" novalidate><label>${at("email")}<input id="auE" type="email" autocomplete="username" inputmode="email" value="${esc(keep)}"></label>
  ${m}<button class="btn teal au-go" type="submit">${at("resetBtn")}</button></form><button class="au-link" data-am="signin">${at("back")}</button>`;
 }else if(mode==="verify"){const u=AUTH_USER_PENDING;
  body=`<h2>${at("verT")}</h2><p class="au-note">${esc(at("verD",{e:(u&&u.email)||""}))}</p>${m}
  <button class="btn teal au-go" id="auVer">${at("verBtn")}</button>
  <button class="au-link" id="auRes">${at("verResend")}</button><button class="au-link" id="auOut">${at("out")}</button>`;
 }else if(mode==="file"){
  body=`<h2>${at("fileT")}</h2><p class="au-note">${at("fileD")}</p><button class="btn au-go" id="auOff">${at("offline")}</button>`;
 }else if(mode==="fail"){
  body=`<p class="au-note">${at("noSdk")}</p><button class="btn teal au-go" id="auRetry">${at("retry")}</button>`;
 }else{body=`<p class="au-note" style="text-align:center">${at("loading")}</p>`;}
 a.innerHTML=`<div class="au-card">${head}${body}</div>`;
 a.querySelectorAll("[data-al]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.al;save(false);showAuth(AUTH_MODE,msg,kind);});
 a.querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>showAuth(b.dataset.am));
 const f=$("#auF");if(f)f.onsubmit=e=>{e.preventDefault();authSubmit(mode);};
 const ids={auVer:authVerified,auRes:authResend,auOut:authSignOut,auOff:authOffline,auRetry:()=>location.reload()};
 for(const k in ids){const el=$("#"+k);if(el)el.onclick=e=>{e.preventDefault();ids[k]();};}
 const fe=$("#auE");if(fe&&!keep)fe.focus();}
let AUTH_USER_PENDING=null;
function authMsg(t,k){const el=$("#auM");if(el){el.textContent=t||"";el.className="au-msg "+(k||"");}}

async function authSubmit(mode){
 const em=($("#auE").value||"").trim().toLowerCase(),pw=($("#auP")||{}).value||"",btn=$("#auF button[type=submit]");
 if(!validMail(em))return authMsg(at("eInvalid"),"err");
 const auth=await fbAuth();if(!auth)return authMsg(at("noSdk"),"err");
 btn.disabled=true;authMsg("");
 try{
  if(mode==="signin"){await auth.signInWithEmailAndPassword(em,pw);}
  else if(mode==="signup"){
   const p2=$("#auP2").value;
   if(ADMIN_EMAILS.indexOf(em)<0&&em.split("@")[1]!==ALLOWED_DOMAIN){btn.disabled=false;return authMsg(at("eDomain",{d:ALLOWED_DOMAIN}),"err");}
   if(pw.length<8){btn.disabled=false;return authMsg(at("ePw"),"err");}
   if(pw!==p2){btn.disabled=false;return authMsg(at("ePwMatch"),"err");}
   const c=await auth.createUserWithEmailAndPassword(em,pw);
   try{await c.user.sendEmailVerification();}catch(e){}
  }else if(mode==="reset"){
   await auth.sendPasswordResetEmail(em);
   btn.disabled=false;return authMsg(at("resetOk"),"ok");
  }
 }catch(e){btn.disabled=false;
  if(mode==="reset"&&(e.code==="auth/user-not-found"))return authMsg(at("resetOk"),"ok");
  authMsg(authErr(e),"err");}
}
async function authVerified(){const auth=await fbAuth();const u=auth&&auth.currentUser;if(!u)return;
 try{await u.reload();}catch(e){return authMsg(authErr(e),"err");}
 if(auth.currentUser.emailVerified)authEnter(auth.currentUser);else authMsg(at("verNo"),"err");}
async function authResend(){const auth=await fbAuth();const u=auth&&auth.currentUser;if(!u)return;
 try{await u.sendEmailVerification();authMsg(at("verSent"),"ok");}catch(e){authMsg(authErr(e),"err");}}
async function authSignOut(){const auth=await fbAuth();AUTH_USER=null;if(auth)await auth.signOut();else showAuth("signin");}
function authOffline(){document.body.classList.remove("locked");$("#auth").style.display="none";}
async function authRegister(u){try{const fs=await fbFs();if(!fs)return;
 await fs.collection("users").doc(u.uid).set({email:(u.email||"").toLowerCase(),role:isAdmin()?"admin":"user",created:(u.metadata&&u.metadata.creationTime)||null,lastLogin:new Date().toISOString()},{merge:true});}catch(e){}}
function authEnter(u){
 if(AUTH_USER&&AUTH_USER.uid===u.uid)return;
 AUTH_USER=u;AUTH_USER_PENDING=null;document.body.classList.remove("locked");$("#auth").style.display="none";
 const adm=isAdmin();$("#syncBtn").style.display=adm?"":"none";$("#usersBtn").style.display=adm?"":"none";
 const ob=$("#outBtn");ob.style.display="";ob.title=at("out")+" ("+u.email+")";
 syncCfg().enabled=true;save(false);render();
 u.getIdToken(true).catch(()=>{}).then(()=>{authRegister(u);syncNow();});}
async function showUsers(){
 openModal(`<h3>\ud83d\udc64 ${at("usersT")}</h3><div id="usrList" class="small">${at("loading")}</div><div class="row" style="margin-top:12px"><span class="grow"></span><button class="btn" value="cancel">${at("closeW")}</button></div>`);
 try{const fs=await fbFs();const q=await fs.collection("users").get();const rows=[];q.forEach(d=>rows.push(d.data()));
  rows.sort((a,b)=>String(a.email).localeCompare(String(b.email)));
  $("#usrList").innerHTML=rows.length?`<table style="width:100%;border-collapse:collapse"><tr><th align=left>${at("colEmail")}</th><th align=left>${at("colRole")}</th><th align=left>${at("colSeen")}</th></tr>${rows.map(r=>`<tr><td>${esc(r.email)}</td><td>${r.role==="admin"||ADMIN_EMAILS.indexOf(r.email)>-1?at("admin"):at("user")}</td><td>${esc(r.lastLogin?new Date(r.lastLogin).toLocaleString():"")}</td></tr>`).join("")}</table>`:at("usersNone");
 }catch(e){$("#usrList").textContent=authErr(e);}}
$("#usersBtn").onclick=showUsers;$("#outBtn").onclick=authSignOut;

(async function authInit(){
 if(!AUTH_GATE)return;
 document.body.classList.add("locked");
 if(location.protocol==="file:"){showAuth("file");return;}
 showAuth("loading");
 const auth=await fbAuth();if(!auth){showAuth("fail");return;}
 auth.onAuthStateChanged(u=>{
  if(u&&u.emailVerified){authEnter(u);}
  else if(u){AUTH_USER=null;AUTH_USER_PENDING=u;showAuth("verify");}
  else{if(AUTH_USER){AUTH_USER=null;["syncBtn","usersBtn","outBtn"].forEach(i=>{$("#"+i).style.display="none"});}showAuth(AUTH_MODE==="signup"?"signup":"signin");}
 });
})();
</script>
